name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        run: |
          V=$(python3 -c "import re;print(re.search(r'\"(.+)\"',open('original_accent/__init__.py').read()).group(1))")
          test "v$V" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but app version is $V"; exit 1; }
      - name: Build the Windows installer
        run: |
          sudo apt-get update && sudo apt-get install -y nsis
          installer/build.sh
          (cd dist && sha256sum *.exe > SHA256SUMS.txt)
          awk '/^## /{n++} n==1' CHANGELOG.md > dist/notes.md
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/SHA256SUMS.txt \
            --draft --title "Original Accent ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md
