name: Release
# Two ways to start a release:
# - push a tag like v0.3.1 (it must match the app version), or
# - Actions → Release → Run workflow, which uses the app version as the tag.
# Either way the installer is built and attached to a draft release to review and publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c "import re;print(re.search(r'\"(.+)\"',open('original_accent/__init__.py').read()).group(1))")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$V" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but app version is $V"; exit 1; }
          fi
          echo "TAG=v$V" >> "$GITHUB_ENV"
          # published already (publishing a draft creates the tag, which runs this again): leave it.
          # still a draft: rebuild its files from this commit.
          D=$(gh release view "v$V" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$D" = "false" ]; then echo "Release v$V is published; nothing to do."; echo "SKIP=1" >> "$GITHUB_ENV"; fi
          echo "DRAFT=$D" >> "$GITHUB_ENV"
      - name: Build the Windows installer
        if: env.SKIP != '1'
        run: |
          sudo apt-get update && sudo apt-get install -y nsis
          installer/build.sh
          (cd dist && sha256sum *.exe > SHA256SUMS.txt)
          awk '/^## /{n++} n==1' CHANGELOG.md > dist/notes.md
      - name: Draft the release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$DRAFT" = "true" ]; then
            gh release upload "$TAG" dist/*.exe dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file dist/notes.md
            exit 0
          fi
          gh release create "$TAG" dist/*.exe dist/SHA256SUMS.txt --target "$GITHUB_SHA" \
            --draft --title "Original Accent ${TAG#v}" --notes-file dist/notes.md
