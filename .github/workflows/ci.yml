name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          python -m py_compile original_accent/*.py workers/*.py
          node --check ui/app.js
      - name: Install
        run: |
          pip install numpy soundfile playwright
          python -m playwright install --with-deps chromium
      - name: Demo-mode UI test (simulated engines, every skin)
        timeout-minutes: 10
        run: python tests/smoke_demo.py
      - name: Installer builds
        run: |
          sudo apt-get update && sudo apt-get install -y nsis
          installer/build.sh
